[package]
name = "forever-addon-manager"
version = "1.1.0"
description = "Addon manager for WoW Forever"
license = "MIT"
edition = "2021"

[lib]
name = "forever_addon_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["sync", "fs", "rt-multi-thread", "macros", "time"] }
futures-util = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }
regex = "1"
dirs = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
