# Builds and tests Forever AddOn Manager on macOS, Windows and Linux.
# Pushing a version tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`) also publishes a
# GitHub Release with the installers. The tag must match "version" in src-tauri/tauri.conf.json.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-15
            args: --target universal-apple-darwin --bundles dmg
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Windows
            os: windows-2022
            args: --bundles nsis
          - name: Linux
            os: ubuntu-22.04
            args: --bundles deb,rpm

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Test
        shell: bash
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build
        shell: bash
        run: |
          npm ci
          npx tauri build ${{ matrix.args }}

      - name: Collect installers (named with the version)
        shell: bash
        run: |
          set -euo pipefail
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          N="Forever-AddOn-Manager-$V"
          mkdir -p out
          # `find` instead of ** globs: macOS runners ship bash 3.2, which has no globstar.
          collect() { find src-tauri/target -path "*/release/bundle/$1/*" -name "$2" -type f | while read -r f; do cp "$f" "out/$N-$3"; done; }
          collect dmg      '*.dmg'        macOS.dmg
          collect nsis     '*-setup.exe'  Windows-x64-setup.exe
          collect deb      '*.deb'        Linux-amd64.deb
          collect rpm      '*.rpm'        Linux-x86_64.rpm
          ls -la out
          [ -n "$(ls out)" ] || { echo "::error::No installer was produced"; exit 1; }

      # Windows code signing through SignPath (free for open source, certificate by SignPath
      # Foundation). Only release tags are signed, and only once the repository variables
      # SIGNPATH_ORGANIZATION_ID and SIGNPATH_PROJECT_SLUG plus the secret SIGNPATH_API_TOKEN
      # are set; until then the installer is published unsigned as before.
      # SignPath only accepts artifacts uploaded by this workflow on GitHub-hosted runners.
      - name: Prepare installer for signing
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p to-sign
          for f in out/*-setup.exe; do mv "$f" "to-sign/$(basename "${f%.exe}")-unsigned.exe"; done
          ls -la to-sign

      - name: Upload unsigned installer for SignPath
        id: unsigned
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v7
        with:
          name: Windows-unsigned
          path: to-sign/

      - name: Sign installer with SignPath
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          # Release signing needs a manual approval in SignPath, so give it up to an hour.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed

      - name: Use signed installer
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          Get-ChildItem signed -Filter *-unsigned.exe | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            if ($sig.Status -ne 'Valid') { throw "$($_.Name) is not validly signed: $($sig.Status)" }
            Write-Host "$($_.Name) signed by $($sig.SignerCertificate.Subject)"
            Move-Item $_.FullName ("out/" + ($_.Name -replace '-unsigned\.exe$', '.exe'))
          }
          Get-ChildItem out
          if (-not (Get-ChildItem out -Filter *-setup.exe)) { throw "No signed installer in out/" }

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: out/

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Check tag matches app version
        run: |
          V=$(node -p "require('./src-tauri/tauri.conf.json').version")
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "::error::Tag ${GITHUB_REF_NAME} doesn't match app version $V"; exit 1; }
      - uses: actions/download-artifact@v8
        with:
          path: out
          merge-multiple: true
      - name: Leave out the unsigned Windows installer (it was only uploaded for SignPath)
        run: rm -f out/*-unsigned.exe && ls -la out
      - name: Remove any older release with this tag (e.g. a leftover draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id"); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            echo "::notice::Deleted older release $id for $GITHUB_REF_NAME"
          done
      - uses: softprops/action-gh-release@v3
        with:
          name: Forever AddOn Manager ${{ github.ref_name }}
          files: out/*
          body: |
            ## Download
            | System | File |
            |---|---|
            | macOS 11+ (Intel and Apple Silicon) | `Forever-AddOn-Manager-…-macOS.dmg` |
            | Windows 10/11 | `Forever-AddOn-Manager-…-Windows-x64-setup.exe` |
            | Debian / Ubuntu | `Forever-AddOn-Manager-…-Linux-amd64.deb` |
            | Fedora / openSUSE | `Forever-AddOn-Manager-…-Linux-x86_64.rpm` |
            | Arch Linux | `forever-addon-manager-bin` from the AUR |

            ## First start
            - **macOS:** open the .dmg and drag the app to Applications. The app isn't notarized by Apple, so the first time right-click it and choose **Open**.
            - **Windows:** run the installer. If SmartScreen shows "Windows protected your PC" (it can for new releases until enough people have downloaded them), choose **More info → Run anyway**.
            - **Linux:** install the .deb (`sudo apt install ./Forever-AddOn-Manager-…-Linux-amd64.deb`) or the .rpm (`sudo dnf install ./Forever-AddOn-Manager-…-Linux-x86_64.rpm`). On Arch, install `forever-addon-manager-bin` from the AUR.

            Then open **Settings** in the app, paste your free CurseForge API key from [console.curseforge.com](https://console.curseforge.com) and click **Save Key**. Check the AddOns folder there too; your WoW Forever addons are found automatically.

            The "Source code" files are added by GitHub to every release; you don't need them.

      - name: Delete draft releases whose tag no longer exists
        # Deleting a tag turns its release into a hidden draft; clean those up.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags=$(gh api "repos/$GITHUB_REPOSITORY/tags" --paginate --jq '.[].name')
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.draft) | "\(.id) \(.tag_name)"' |
          while read -r id tag; do
            if ! printf '%s\n' $tags | grep -qx "$tag"; then
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
              echo "::notice::Deleted orphaned draft release $id ($tag)"
            fi
          done
